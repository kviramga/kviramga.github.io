# --------------
# -- Settings --
# --------------

# If you are hosting in a sub-folder, for example: https://mlh.github.io/mlh-hackathon-boilerplate/,
# you must specify it as the baseurl
# If you hosting as a root, for example: htttps://[github username].github.io, then leave it blank
# baseurl: "/mlh-hackathon-boilerplate"

# uncomment the next line if you are hosting as a root and not sub-folder
# for example, when runnig locally at http://127.0.0.1:4000/
baseurl: ""

# If you're using GitHub pages without a custom domain, this is "https://[github username].github.io"
# If you're using GitHub pages with a custom domain, this is "http://[your domain]" (or https if you're using SSL)
url: "https://kviramga.github.io"

# The ability to use custom themes.
style:
  theme: "innovateher"

# This will help you track who's visiting your website.
tracking:
  google_analytics: "UA-43729070-14"

# Let people connect & engage with you through social media.
social:
  insta_handle: "innovateherhacks"

# This is Search Engine Optimization. It'll help your website look better on search.
seo:
  title:       "InnovateHer | 7-8 February 2026"
  description: "Join us for InnovateHer, Purdue University's annual women-centric hackathon! Students of all skill levels will come together to learn, build, and connect through tech. Expect exciting workshops, inspiring mentors, and a supportive space to bring your ideas to life."
  image:       "https://prime.mlh.io/img/logos/mlh-prime-color.svg"

# Event information.
event:
  name:        "InnovateHer Hackathon"
  description: "Join us for InnovateHer, Purdue University's annual women-centric hackathon! Students of all skill levels will come together to learn, build, and connect through tech. Expect exciting workshops, inspiring mentors, and a supportive space to bring your ideas to life."
  date:        "7-8 February 2026"
  location:    "WALC, Purdue University"

  trust_badge:
    year:   "2026"  # season year
    region: "eu"    # "na" or "eu"
    color:  "white" # "white", "black", "gray", "red", "blue" or "yellow"

  hero:
    links:
      - text: "Join our mailing list!"
        href: "https://docs.google.com/forms/d/e/1FAIpQLSc0feSn0ATjL58NiR1eaq82YxFKzPsxHJCIxqxboVwSJtL5iA/viewform?usp=sf_link"
      - text: "Sponsor"
        href: "https://docs.google.com/forms/d/e/1FAIpQLSfWZgYqwD0btXIvs1F0X5xNbswk1PvaysFrVEGiqnBGVCaJrQ/viewform?usp=header"

  about:
    description: >
      InnovateHer is a women-centric hackathon hosted at Purdue University that empowers students to learn, build, and innovate together. Through mentorship, workshops, and a welcoming community, we aim to foster creativity, confidence, and collaboration in tech.

  # Info Sections
  info:
    sections:
      - image: "images/image1.png"
        title: "LEARN."
        description: >
          Explore new technologies and workshops led by industry professionals and fellow students. Whether you're a beginner or experienced hacker, there's something for everyone to discover.
      - image: "images/image2.png"
        title: "BUILD."
        description: >
          Collaborate with a team to turn your ideas into reality. Code, design, prototype, and bring innovative solutions to life during 24 hours of creativity.
      - image: "images/image3.png"
        title: "SHARE."
        description: >
          Present your project to judges, peers, and tech mentors. Celebrate what you've created and inspire others with your ideas, passion, and hard work.

  # Frequently asked questions.
  faq:
    - question: "What is a hackathon?"
      answer: >
        A hackathon is an invention marathon. Students come together to build cool
        software & hardware hacks over 24-48 hours. It's [very beginner friendly](https://medium.com/@tfogo/hackathons-are-for-beginners-77a9c9c0e000#.cj21niskl).
   - question: "How much does it cost?"
      answer: >
        Nothing. Attending a hackathon is free.
    - question: "Do I need to be a student to attend?"
      answer: >
        Yes. Only students who are currently enrolled at a college/university or
        have graduated within the past 12 months are eligible to attend.
    - question: "Where is the event?"
      answer: >
        The event is being hosted at the Wilmeth Active Learning Center at Purdue University.
    - question: "What is Major League Hacking?"
      answer: >
        Major League Hacking is [the official student hackathon league](https://mlh.io) in North America & Europe.
        We work with over 200 Member Events and empower over 70,000 students every year.
    - question: "Is there a code of conduct?"
      answer: >
        Yes there is. We enforce it very strongly. You can [find it here](https://static.mlh.io/docs/mlh-code-of-conduct.pdf).

  # This is the message you'll receive once you've registered.
  register:
    message: >
      You'll receive more information closer to the hackathon.

# ----------------------------------------------------
# -- Ignore this unless you know what you're doing. --
# ----------------------------------------------------

markdown: kramdown
exclude:
 - node_modules
 - gulpfile.js
 - Gemfile
 - Gemfile.lock
 - package.json
 - README.md
 - CNAME
